<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Engenharia — Projetos, Obras, Gestão</title>
  <desc id="desc">Símbolo arquitetônico azul-marinho e verde-água, com a palavra Engenharia e o slogan Projetos, Obras, Gestão.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B68"/>
      <stop offset="1" stop-color="#102746"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35C8B0"/>
      <stop offset="1" stop-color="#128C83"/>
    </linearGradient>
  </defs>
  <!-- Architectural mark: roofline, structural frame, and rising building -->
  <g transform="translate(60 48)">
    <rect x="0" y="0" width="250" height="250" rx="42" fill="#F1F6FB"/>
    <path d="M42 100L125 35L208 100" fill="none" stroke="url(#navy)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 104V202H192V104" fill="none" stroke="url(#navy)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 202V145H119V202M139 202V119H172V202" fill="none" stroke="url(#teal)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M43 218H207" stroke="#173B68" stroke-width="9" stroke-linecap="round"/>
    <circle cx="190" cy="62" r="17" fill="url(#teal)"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="360" y="159" font-size="31" font-weight="650" letter-spacing="5.5" fill="#128C83">ENGENHARIA</text>
    <path d="M360 184H770" stroke="#D8E3ED" stroke-width="2"/>
    <text x="360" y="224" font-size="22" font-weight="450" letter-spacing=".4" fill="#52657A">PROJETOS  •  OBRAS  •  GESTÃO</text>
  </g>
