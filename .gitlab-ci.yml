stages:
  - deploy
  - buscar

create-pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html captura.html manifest.webmanifest sw.js _redirects public/
    - cp -r css js icones public/
    - if [ -d libs ]; then cp -r libs public/; fi
  pages: true
  rules:
    # o agendamento e o "Buscar agora" rodam só a busca, sem publicar o site de novo
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Busca dos dados da NFC-e das capturas da obra (servidor/buscar-nfce.mjs). Roteiro em docs/busca-nfce.md.
# FIREBASE_SA: variável de CI protegida com a chave da conta de serviço do Firebase (tipo File ou Variable; o script aceita os dois).
buscar-nfce:
  stage: buscar
  image: node:22-alpine
  cache:
    key: servidor-$CI_COMMIT_REF_SLUG
    paths:
      - servidor/node_modules/
  variables:
    GIT_DEPTH: "1"
  script:
    - cd servidor
    - npm install --no-fund --no-audit --omit=dev
    - node buscar-nfce.mjs
  rules:
    - if: '($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Build › Pipelines › Executar pipeline (manual, na main): roda a busca e publica o site
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  timeout: 10 minutes
