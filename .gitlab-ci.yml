
stages:
  - deploy

create-pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html captura.html manifest.webmanifest sw.js public/
    - cp -r css js icones public/
    - if [ -d libs ]; then cp -r libs public/; fi
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
